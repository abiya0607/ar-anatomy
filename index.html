<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Anatomy Explorer</title>
  <!-- Load A-Frame and MindAR Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/card-example/card.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- This links to your 3D brain model inside the assets folder -->
    <a-asset-item id="brainModel" src="assets/brain.glb"></a-asset-item>  
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- When the target card is scanned, the 3D brain appears -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        src="#brainModel" 
        position="0 0 0" 
        scale="0.5 0.5 0.5">
      </a-gltf-model>
    </a-entity>
    
  </a-scene>
</body>
</html>
